[project]
name = "gmail-mcp"
version = "2.0.0"
description = "Multi-tenant Gmail MCP server (stdio + remote streamable-HTTP)"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
gmail-mcp = "gmail_mcp.server:main"
gmail-mcp-admin = "gmail_mcp.admin_cli:main"
